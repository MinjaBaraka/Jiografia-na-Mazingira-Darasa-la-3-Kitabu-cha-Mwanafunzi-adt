  <style>
    .pg5-page {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 64rem;
      min-height: 0;
      margin: 0 auto;
      overflow: visible;
      background: #fff;
      color: #252525;
    }

    .pg5-content {
      position: relative;
      z-index: 2;
      padding: clamp(8rem, 13vw, 10rem) clamp(7rem, 13vw, 9rem) 4rem clamp(7rem, 13.5vw, 9.5rem);
    }

    .pg5-copy {
      max-width: 47rem;
      margin: 0;
      color: #252525;
      font-family: "Comic Sans MS", "Chalkboard SE", "Atkinson Hyperlegible", sans-serif;
      font-size: clamp(1.2rem, 2.35vw, 1.62rem);
      font-style: normal;
      font-weight: 400;
      line-height: 1.42;
      text-align: justify;
      text-justify: inter-word;
    }

    /* This remains one book paragraph when Easy Read is enabled. */
    .pg5-copy span {
      display: inline !important;
      margin-block-end: 0 !important;
      font: inherit;
    }

    .pg5-signature {
      width: clamp(9rem, 17vw, 11.5rem);
      margin: clamp(2.25rem, 4.3vw, 3rem) 0 .35rem .25rem;
    }

    .pg5-signature img {
      display: block;
      width: 100%;
      height: auto;
    }

    .pg5-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .28rem;
      color: #252525;
    }

    .pg5-identity p {
      margin: 0;
      color: inherit;
      font-family: "Comic Sans MS", "Chalkboard SE", "Atkinson Hyperlegible", sans-serif;
      font-size: clamp(1.18rem, 2.2vw, 1.52rem);
      font-style: normal;
      font-weight: 400;
      line-height: 1.35;
      text-align: left;
    }

    .pg5-identity p:last-child {
      margin-top: .1rem;
      font-weight: 700;
    }

    .pg5-identity span {
      display: inline !important;
      margin-block-end: 0 !important;
      font: inherit;
    }

    .pg5-side-rule {
      position: absolute;
      z-index: 1;
      top: 2.6rem;
      right: clamp(2.75rem, 5vw, 4.25rem);
      width: clamp(2.65rem, 4.6vw, 3.3rem);
      height: clamp(13rem, 22vw, 16rem);
      border-radius: 0 0 0 1.35rem;
      background: #3893a0;
    }

    .pg5-watermark {
      position: absolute;
      z-index: 3;
      top: 52%;
      left: 50%;
      width: 112%;
      transform: translate(-50%, -50%) rotate(-45deg);
      color: rgb(255 118 118 / 38%);
      font-family: Arial, sans-serif;
      font-size: clamp(2.7rem, 6vw, 4.6rem);
      font-style: normal;
      font-weight: 800;
      letter-spacing: .035em;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 42rem) {
      .pg5-page { min-height: 0; }
      .pg5-content { padding: 7rem 4.5rem 4rem 4rem; }
      .pg5-copy { text-align: left; }
      .pg5-side-rule { right: 1.5rem; width: 2.35rem; height: 11rem; }
      .pg5-watermark { font-size: 2.25rem; }
    }
  </style>
</head>
