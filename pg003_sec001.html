    /* Printed page iii: this is the book artwork, separate from the ADT dock. */
    .yaliyomo-page {
      position: relative;
      min-height: clamp(58rem, 132vw, 82rem);
      overflow: hidden;
    }

    .yaliyomo-page__content { padding-bottom: 10.5rem; }

    .yaliyomo-footer {
      position: absolute;
      right: 3.5%;
      bottom: 0;
      left: 3.5%;
      height: clamp(7.5rem, 12vw, 10rem);
      pointer-events: none;
    }

    .yaliyomo-footer__base {
      position: absolute;
      inset: auto 0 0;
      height: 72%;
      background: #5699aa;
    }

    .yaliyomo-footer__left {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 52%;
      height: 100%;
      background: #5699aa;
      clip-path: polygon(0 18%, 100% 68%, 100% 100%, 0 100%);
    }

    .yaliyomo-footer__right {
      position: absolute;
      right: 0;
      bottom: 38%;
      width: 54%;
      height: 62%;
      background: #00687e;
      clip-path: polygon(0 100%, 100% 0, 100% 62%, 0 100%);
    }

    .yaliyomo-footer__accent {
      position: absolute;
      right: 0;
      bottom: 40%;
      width: 47%;
      height: 23%;
      background: #087890;
      clip-path: polygon(0 100%, 100% 0, 100% 100%);
    }

    .yaliyomo-footer__capsule {
      position: absolute;
      bottom: 0;
      left: 50%;
      display: grid;
      width: clamp(3.75rem, 6vw, 5rem);
      height: 82%;
      transform: translateX(-50%);
      place-items: start center;
      padding-top: clamp(.75rem, 1.4vw, 1rem);
      border-radius: 1.25rem 1.25rem 0 0;
      background: #00687e;
      box-sizing: border-box;
    }

    .yaliyomo-footer__number {
      display: grid;
      width: clamp(2.7rem, 4.2vw, 3.65rem);
      aspect-ratio: 1;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      color: #245083;
      font-family: Georgia, serif;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      font-style: normal;
    }
  </style>
